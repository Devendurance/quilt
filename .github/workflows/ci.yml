name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:contracts
      - run: NEXT_PUBLIC_DEV_WALLET_URL=http://127.0.0.1:8545 npm run build
      - run: npm run check:prod-bundle
